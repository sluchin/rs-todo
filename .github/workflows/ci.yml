name: CI

# main への push と, すべての pull request で実行する.
on:
  push:
    branches:
      - main
  pull_request:

# 同じブランチで新しい実行が始まったら, 古い実行を取り消す.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      # リポジトリを取得する.
      - uses: actions/checkout@v5

      # npm run check のフロントエンド部分 (tsc, vite, eslint, vitest) に使う.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      # npm run check のバックエンド部分 (clippy, cargo test, cargo fmt) に使う.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # src-tauri のビルド成果物をキャッシュし, 以降の実行を速くする.
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          prefix-key: "v2-rust-cache"

      # Tauri のビルドに必要な Linux のシステムライブラリ
      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      # package-lock.json どおりに依存をインストールする.
      - name: Install frontend dependencies
        run: npm ci

      # cargo clippy / cargo test は tauri.conf.json の frontendDist (dist) を参照するため, 先にビルドする.
      - name: Build frontend
        run: npm run build

      # 整形チェック, eslint, clippy, vitest, cargo test, cargo fmt --check
      - name: Check
        run: npm run check

  deploy-docs:
    needs: check
    # main への push のときだけ公開する (pull request では公開しない).
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # cargo doc は tauri をビルドするため、Linux のシステムライブラリが必要.
      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Install dependencies
        run: npm ci

      # tauri-build が frontendDist (dist) を参照するため、先にビルドする.
      - name: Build frontend
        run: npm run build

      # フロントエンド (typedoc) とバックエンド (cargo doc) のドキュメントを作る.
      - name: Build documentation
        run: npm run doc

      - name: Organize documentation
        run: |
          mkdir -p combined_docs/fe combined_docs/be
          cp -r docs/fe/* combined_docs/fe/
          if [ -d "src-tauri/target/doc_build/doc" ]; then
            cp -r src-tauri/target/doc_build/doc/* combined_docs/be/
          fi
          cat << 'HTML' > combined_docs/index.html
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="utf-8">
              <title>rstodo Documentation</title>
              <style>
                  body { font-family: sans-serif; text-align: center; margin-top: 50px; }
                  ul { list-style: none; padding: 0; }
                  li { margin: 15px 0; }
                  a { font-size: 1.2em; text-decoration: none; color: #0066cc; }
                  a:hover { text-decoration: underline; }
              </style>
          </head>
          <body>
              <h1>rstodo Documentation</h1>
              <ul>
                  <li><a href="fe/index.html">Frontend Documentation (TypeDoc)</a></li>
                  <li><a href="be/rstodo/index.html">Backend Documentation (Cargo Doc)</a></li>
              </ul>
          </body>
          </html>
          HTML

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: combined_docs/

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
